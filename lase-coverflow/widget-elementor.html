<!-- ============================================================
  LASE 2026 · Cover Flow de palestrantes
  Cole este bloco inteiro num widget "HTML" do Elementor.

  De onde vêm os palestrantes: do módulo de Posts da mesma página
  (os cards em "Palestrantes confirmados"). Ele lê foto, nome e o
  resumo (cargo, empresa) de cada post. Para incluir ou tirar
  alguém, mexa só na query daquele módulo, como já faz hoje.

  Opções (atributos da <div class="lase-cf"> abaixo):
    data-fonte="#id ou .classe"  módulo de Posts a ler (vazio = acha sozinho
                                 o que tem posts da categoria "palestrantes")
    data-ocultar-fonte="nao"     "sim" esconde o grid original no site publicado
                                 (no editor do Elementor ele continua visível)
    data-autoplay="3"            segundos entre trocas automáticas (0 = desligado);
                                 pausa com o mouse em cima ou enquanto a pessoa navega
    data-abrir-perfil="sim"      clicar na capa central abre o perfil
============================================================ -->
<div class="lase-cf" data-fonte="" data-ocultar-fonte="nao" data-autoplay="3" data-abrir-perfil="sim"
     role="region" aria-roledescription="carrossel" aria-label="Palestrantes do LASE 2026">
  <div class="lase-cf__stage" tabindex="0" aria-label="Use as setas para navegar">
    <div class="lase-cf__floor"></div>
    <div class="lase-cf__track"></div>
  </div>
  <div class="lase-cf__info" aria-live="polite">
    <div class="lase-cf__nome"></div>
    <div class="lase-cf__cargo"></div>
  </div>
  <div class="lase-cf__nav">
    <button type="button" class="lase-cf__btn" data-dir="-1" aria-label="Anterior">&#8249;</button>
    <input type="range" class="lase-cf__range" min="0" max="0" value="0" step="1" aria-label="Escolher palestrante">
    <button type="button" class="lase-cf__btn" data-dir="1" aria-label="Próximo">&#8250;</button>
  </div>
  <div class="lase-cf__count"></div>
</div>

<style>
.lase-cf{
  --neon:#53DFD1; --neon-soft:rgba(83,223,209,.35); --txt:#f2f7f6; --txt2:#bff4ee;
  --w:200px; --h:267px;
  position:relative; overflow:hidden; box-sizing:border-box; width:100%;
  padding:28px 0 22px; border-radius:0; color:var(--txt); font-family:inherit;
  background:radial-gradient(ellipse 80% 70% at 50% 32%,#2F4442 0%,#132120 52%,#060a0a 100%);
  -webkit-user-select:none; user-select:none;
}
.lase-cf *,.lase-cf *::before,.lase-cf *::after{box-sizing:border-box}
.lase-cf__stage{position:relative; height:calc(var(--h)*1.42); outline:none; touch-action:pan-y; cursor:grab}
.lase-cf__stage:active{cursor:grabbing}
.lase-cf__stage:focus-visible{box-shadow:inset 0 0 0 2px var(--neon-soft)}
.lase-cf__track{position:absolute; inset:0; perspective:calc(var(--w)*4.2); perspective-origin:50% 35%}
.lase-cf__floor{position:absolute; left:6%; right:6%; top:calc(var(--h) + 18px); height:2px; pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--neon) 30%,var(--neon) 70%,transparent);
  box-shadow:0 0 14px 2px var(--neon-soft),0 0 40px 6px rgba(83,223,209,.15); opacity:.75}
.lase-cf__item{position:absolute; left:50%; top:18px; width:var(--w); margin-left:calc(var(--w)/-2);
  transform-style:preserve-3d; will-change:transform; display:none}
.lase-cf__cover{position:relative; width:var(--w); height:var(--h); overflow:hidden; border-radius:0;
  background:#1d2c2b; box-shadow:0 10px 30px rgba(0,0,0,.55)}
.lase-cf__cover img,.lase-cf__refl img{display:block; width:100%; height:100%; object-fit:cover; object-position:50% 20%;
  pointer-events:none; -webkit-user-drag:none}
.lase-cf__cover::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 38%)}
.lase-cf__item.is-center .lase-cf__cover{box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(83,223,209,.55),0 0 26px rgba(83,223,209,.28)}
.lase-cf__refl{position:relative; width:var(--w); height:calc(var(--h)*.42); overflow:hidden; margin-top:2px; pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,0) 95%);
          mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),rgba(0,0,0,0) 95%)}
.lase-cf__refl img{height:var(--h); transform:scaleY(-1); transform-origin:50% 50%; margin-top:0;
  }
.lase-cf__refl > img{filter:grayscale(1) sepia(1) hue-rotate(128deg) saturate(3.2) brightness(.95)}
.lase-cf__refl::after{content:""; position:absolute; left:0; right:0; top:0; height:2px;
  background:var(--neon); box-shadow:0 0 10px 2px var(--neon),0 0 26px 4px var(--neon-soft); opacity:.45}
.lase-cf__item.is-center .lase-cf__refl::after{opacity:1}
.lase-cf__item.is-center .lase-cf__refl{-webkit-mask-image:linear-gradient(to bottom,#000,rgba(0,0,0,0) 95%);mask-image:linear-gradient(to bottom,#000,rgba(0,0,0,0) 95%)}
.lase-cf__ini{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  font-size:calc(var(--w)*.3); font-weight:700; color:var(--neon); letter-spacing:.04em;
  background:radial-gradient(circle at 50% 40%,#2F4442,#0e1716)}
.lase-cf__item.no-img .lase-cf__ini{display:flex}
.lase-cf__item.no-img img{visibility:hidden}
.lase-cf__info{text-align:center; padding:0 18px; min-height:4.4em; margin-top:-4px; transition:opacity .25s}
.lase-cf__info.is-fading{opacity:0}
.lase-cf__nome{font-size:clamp(18px,2.2vw,26px); font-weight:700; line-height:1.2; color:#fff;
  text-shadow:0 0 18px rgba(83,223,209,.35)}
.lase-cf__cargo{font-size:clamp(13px,1.4vw,16px); line-height:1.35; color:var(--txt2); margin-top:6px;
  max-width:640px; margin-left:auto; margin-right:auto}
.lase-cf__nav{display:flex; align-items:center; gap:14px; max-width:520px; margin:14px auto 0; padding:0 16px}
.lase-cf__btn{flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1px solid var(--neon-soft); padding:0;
  background:rgba(83,223,209,.08); color:var(--neon); font-size:26px; line-height:34px; cursor:pointer; transition:background .2s,box-shadow .2s}
.lase-cf__btn:hover,.lase-cf__btn:focus-visible{background:rgba(83,223,209,.2); box-shadow:0 0 14px var(--neon-soft); outline:none}
.lase-cf__range{flex:1 1 auto; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; margin:0;
  background:rgba(83,223,209,.22); outline:none; cursor:pointer}
.lase-cf__range::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; border:0;
  background:var(--neon); box-shadow:0 0 12px var(--neon)}
.lase-cf__range::-moz-range-thumb{width:18px; height:18px; border-radius:50%; border:0; background:var(--neon); box-shadow:0 0 12px var(--neon)}
.lase-cf__count{text-align:center; font-size:12px; letter-spacing:.12em; color:rgba(191,244,238,.6); margin-top:10px}
.lase-cf__vazio{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--txt2); padding:20px; text-align:center}
@media (prefers-reduced-motion:reduce){.lase-cf__info{transition:none}}
</style>

<script>
(function(){
  function maiorDoSrcset(ss){
    var best=null, bw=-1;
    (ss||'').split(',').forEach(function(p){
      var t=p.trim().split(/\s+/); if(!t[0]) return;
      var w=parseInt(t[1],10)||0; if(w>bw){bw=w; best=t[0];}
    });
    return best;
  }
  function fotoDe(img){
    if(!img) return '';
    var ss=img.getAttribute('data-srcset')||img.getAttribute('data-lazy-srcset')||img.getAttribute('srcset');
    return maiorDoSrcset(ss)||img.getAttribute('data-src')||img.getAttribute('data-lazy-src')||img.currentSrc||img.src||'';
  }
  function iniciais(n){
    var p=n.trim().split(/\s+/); return ((p[0]||'')[0]||'')+(p.length>1?(p[p.length-1][0]||''):'');
  }
  function lerFonte(root){
    var w=null, sel=root.getAttribute('data-fonte');
    if(sel){ try{ w=document.querySelector(sel); }catch(e){} }
    if(!w){
      var a=document.querySelector('.elementor-widget-posts article.category-palestrantes');
      w=a&&a.closest('.elementor-widget-posts');
    }
    if(!w) return {widget:null,lista:[]};
    var lista=[];
    w.querySelectorAll('article').forEach(function(a){
      var t=a.querySelector('.elementor-post__title'); if(!t) return;
      var l=t.querySelector('a');
      var ex=a.querySelector('.elementor-post__excerpt');
      lista.push({
        nome:t.textContent.replace(/\s+/g,' ').trim(),
        desc:ex?ex.textContent.replace(/\s+/g,' ').trim():'',
        foto:fotoDe(a.querySelector('.elementor-post__thumbnail img')),
        link:l?l.href:''
      });
    });
    return {widget:w,lista:lista};
  }

  function iniciar(root){
    if(root.getAttribute('data-ok')) return; root.setAttribute('data-ok','1');
    var stage=root.querySelector('.lase-cf__stage'), track=root.querySelector('.lase-cf__track'),
        info=root.querySelector('.lase-cf__info'), elNome=root.querySelector('.lase-cf__nome'),
        elCargo=root.querySelector('.lase-cf__cargo'), range=root.querySelector('.lase-cf__range'),
        count=root.querySelector('.lase-cf__count');
    var fonte=lerFonte(root), dados=fonte.lista;
    var noEditor=document.body.classList.contains('elementor-editor-active');
    if(fonte.widget && root.getAttribute('data-ocultar-fonte')!=='nao' && !noEditor) fonte.widget.style.display='none';
    if(!dados.length){
      stage.innerHTML='<div class="lase-cf__vazio">Nenhum palestrante encontrado no módulo de Posts desta página.</div>';
      root.querySelector('.lase-cf__nav').style.display='none'; return;
    }

    var itens=dados.map(function(d,i){
      var el=document.createElement('div'); el.className='lase-cf__item'; el.setAttribute('data-i',i);
      el.innerHTML='<div class="lase-cf__cover"><img alt="" draggable="false"><div class="lase-cf__ini"></div></div>'+
                   '<div class="lase-cf__refl"><img alt="" draggable="false"></div>';
      el.querySelector('.lase-cf__ini').textContent=iniciais(d.nome);
      el.querySelector('.lase-cf__cover img').alt=d.nome;
      if(!d.foto) el.classList.add('no-img');
      track.appendChild(el);
      return {el:el, carregado:false};
    });
    function carregar(i){
      var it=itens[i]; if(it.carregado) return; it.carregado=true;
      var f=dados[i].foto; if(!f) return;
      var a=it.el.querySelectorAll('img');
      a[0].onerror=function(){ it.el.classList.add('no-img'); };
      a[0].src=f; a[1].src=f;
    }

    var N=dados.length, W=200, VIS=7, pos=0, alvo=0, atual=-1, raf=0;
    range.max=N-1;

    function medir(){
      var cw=root.clientWidth||800;
      W=Math.round(Math.min(230,Math.max(118,cw*(cw<600?0.36:0.2))));
      VIS=cw<600?4:7;
      root.style.setProperty('--w',W+'px');
      root.style.setProperty('--h',Math.round(W*4/3)+'px');
    }

    function md(x){ return ((x%N)+N)%N; }
    function volta(d){ return md(d+N/2)-N/2; }  // distância mais curta no círculo
    function render(){
      for(var i=0;i<N;i++){
        var d=volta(i-pos), a=Math.abs(d), el=itens[i].el;
        if(a>VIS+0.5){ if(el.style.display!=='none') el.style.display='none'; continue; }
        if(a<VIS+2) carregar(i);
        var s=d<0?-1:1, t=Math.min(a,1);
        var x=s*(t*W*0.66+Math.max(a-1,0)*W*0.2);
        var rot=-s*t*62, z=-t*W*0.85;
        el.style.display='block';
        el.style.transform='translateX('+x.toFixed(1)+'px) translateZ('+z.toFixed(1)+'px) rotateY('+rot.toFixed(2)+'deg)';
        el.style.zIndex=1000-Math.round(a*10);
        el.style.opacity=a>VIS-1?Math.max(0,VIS+0.5-a)/1.5:1;
        el.classList.toggle('is-center',a<0.5);
      }
      var c=md(Math.round(pos));
      if(c!==atual){ atual=c; mostrarTexto(c); }
    }
    var tFade=0;
    function mostrarTexto(i){
      clearTimeout(tFade); info.classList.add('is-fading');
      tFade=setTimeout(function(){
        elNome.textContent=dados[i].nome; elCargo.textContent=dados[i].desc;
        info.classList.remove('is-fading');
      },120);
      range.value=i; count.textContent=(i+1)+' / '+N;
    }
    function loop(){
      var dif=alvo-pos;
      if(Math.abs(dif)<0.002){ pos=alvo; render(); raf=0; return; }
      pos+=dif*0.16; render(); raf=requestAnimationFrame(loop);
    }
    function irPara(i){
      alvo=i;
      if(!raf) raf=requestAnimationFrame(loop);
      reiniciarAuto();
    }

    // arrastar / tocar
    var arrastando=false, x0=0, p0=0, moveu=false, idPtr=null;
    stage.addEventListener('pointerdown',function(e){
      if(e.button&&e.button!==0) return;
      arrastando=true; moveu=false; x0=e.clientX; p0=pos; idPtr=e.pointerId;
      if(raf){ cancelAnimationFrame(raf); raf=0; }
    });
    stage.addEventListener('pointermove',function(e){
      if(!arrastando||e.pointerId!==idPtr) return;
      var dx=e.clientX-x0;
      if(!moveu && Math.abs(dx)>6){ moveu=true; try{stage.setPointerCapture(idPtr);}catch(_){} }
      if(moveu){ pos=p0-dx/(W*0.42); alvo=pos; render(); }
    });
    function soltar(e){
      if(!arrastando) return; arrastando=false;
      if(moveu){ irPara(Math.round(pos)); return; }
      var it=e.target.closest&&e.target.closest('.lase-cf__item');
      if(!it){ irPara(Math.round(pos)); return; }
      var i=+it.getAttribute('data-i');
      if(i===atual && Math.abs(volta(i-pos))<0.3){
        if(root.getAttribute('data-abrir-perfil')!=='nao' && dados[i].link) window.location.href=dados[i].link;
      } else irPara(Math.round(pos)+Math.round(volta(i-pos)));
    }
    stage.addEventListener('pointerup',soltar);
    stage.addEventListener('pointercancel',function(){ if(arrastando){arrastando=false; irPara(Math.round(pos));} });

    // roda/trackpad na horizontal
    var acc=0;
    stage.addEventListener('wheel',function(e){
      var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);
      if(!d) return; e.preventDefault(); acc+=d;
      if(Math.abs(acc)>40){ irPara(Math.round(alvo)+(acc>0?1:-1)); acc=0; }
    },{passive:false});

    // teclado
    stage.addEventListener('keydown',function(e){
      var k=e.key;
      if(k==='ArrowRight'){irPara(Math.round(alvo)+1); e.preventDefault();}
      else if(k==='ArrowLeft'){irPara(Math.round(alvo)-1); e.preventDefault();}
      else if(k==='Home'){irPara(Math.round(alvo)-md(Math.round(alvo))); e.preventDefault();}
      else if(k==='End'){irPara(Math.round(alvo)-md(Math.round(alvo))+N-1); e.preventDefault();}
      else if(k==='Enter' && dados[atual].link && root.getAttribute('data-abrir-perfil')!=='nao'){ window.location.href=dados[atual].link; }
    });

    root.querySelectorAll('.lase-cf__btn').forEach(function(b){
      b.addEventListener('click',function(){ irPara(Math.round(alvo)+(+b.getAttribute('data-dir'))); });
    });
    range.addEventListener('input',function(){ var r=Math.round(alvo); irPara(r+Math.round(volta(+range.value-r))); });

    // troca automática opcional
    var seg=parseFloat(root.getAttribute('data-autoplay'))||0, tAuto=0, emCima=false;
    function reiniciarAuto(){
      if(!seg) return; clearInterval(tAuto);
      tAuto=setInterval(function(){
        if(emCima||arrastando||document.hidden) return;
        alvo=Math.round(alvo)+1; if(!raf) raf=requestAnimationFrame(loop);
      },seg*1000);
    }
    root.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse') emCima=true; });
    root.addEventListener('pointerleave',function(e){ if(e.pointerType==='mouse'){ emCima=false; reiniciarAuto(); } });

    medir(); render(); reiniciarAuto();
    var tRes=0;
    window.addEventListener('resize',function(){ clearTimeout(tRes); tRes=setTimeout(function(){ medir(); render(); },100); });
  }

  function tudo(){ document.querySelectorAll('.lase-cf').forEach(iniciar); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tudo); else tudo();
  window.addEventListener('load',tudo);
})();
</script>
