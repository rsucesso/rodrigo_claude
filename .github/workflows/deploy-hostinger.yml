name: Deploy jogo para Hostinger

on:
  push:
    branches: [claude/werner-grau-streets-of-rage-game-17qoms, main]
    paths: [werner-game/index.html, .github/workflows/deploy-hostinger.yml]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          mkdir -p deploy
          cp werner-game/index.html deploy/index.html

      - name: Enviar por FTP para intellivent/wg
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ vars.FTP_DIR || 'intellivent/wg/' }}
