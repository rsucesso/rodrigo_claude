<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f2418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Werner: Fúria Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap">
<style>
/* Layout: one landscape arcade screen, canvas centered and letterboxed, touch controls floating over the corners */
:root{
  --night:#0f2418;   /* letterbox ground, deep forest */
  --ink:#15110e;     /* cartoon outline */
  --sun:#ffd23f;     /* arcade yellow */
  --leaf:#39b54a;    /* law green */
  --hot:#ff4f3a;     /* punch red */
  --paper:#fff6e0;
  --display:"Bangers","Impact","Arial Black",sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);color:var(--paper)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#173a26 0%,var(--night) 70%)}
#game{display:block;box-shadow:0 0 0 3px var(--ink),0 10px 40px rgba(0,0,0,.6);background:#000}
#ctl{position:fixed;inset:0;pointer-events:none;z-index:5}
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:72%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;background:rgba(255,246,224,.12);border:3px solid rgba(255,246,224,.35);left:calc(86px + env(safe-area-inset-left,0px));top:calc(100% - 88px - env(safe-area-inset-bottom,0px))}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,210,63,.85);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#btns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:210px;height:180px;pointer-events:none}
.btn{position:absolute;pointer-events:auto;opacity:.82;touch-action:none;border-radius:50%;border:3px solid var(--ink);font-family:var(--display);letter-spacing:.04em;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.45);padding:0;cursor:pointer}
.btn:active,.btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45);filter:brightness(1.15)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#bA{right:0;bottom:8px;width:92px;height:92px;background:var(--hot);font-size:22px}
#bB{right:100px;bottom:0;width:72px;height:72px;background:#5ec8f2;font-size:18px}
#bC{right:62px;bottom:104px;width:66px;height:66px;background:var(--leaf);font-size:18px;color:var(--paper);text-shadow:0 2px 0 var(--ink)}
#bC.ready{animation:pulse .8s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 6px rgba(255,210,63,.7),0 4px 0 rgba(0,0,0,.45)}}
#top{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
#top button{width:40px;height:34px;border-radius:9px;border:2px solid var(--ink);background:rgba(255,246,224,.85);color:var(--ink);font:900 15px var(--body);cursor:pointer;padding:0}
#top button:focus-visible{outline:3px solid var(--sun)}
#rotate{position:fixed;inset:0;z-index:10;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#rotate h2{font:400 44px/1 var(--display);color:var(--sun);margin:0;letter-spacing:.03em;text-shadow:3px 3px 0 var(--ink)}
#rotate p{margin:0;max-width:30ch;font-size:16px;line-height:1.45}
#rotate .phone{width:64px;height:104px;border:5px solid var(--paper);border-radius:12px;animation:turn 1.6s ease-in-out infinite}
@keyframes turn{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#rotOk{font:400 20px var(--display);letter-spacing:.04em;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#rotate .phone,#bC.ready{animation:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="640" height="360" aria-label="Jogo Werner: Fúria Verde"></canvas></div>

<div id="ctl" hidden>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="btns">
    <button id="bC" class="btn" aria-label="Golpe especial da Lei">LEI</button>
    <button id="bB" class="btn" aria-label="Pular">PULO</button>
    <button id="bA" class="btn" aria-label="Soco">SOCO</button>
  </div>
</div>
<div id="top">
  <button id="bPause" aria-label="Pausar">II</button>
  <button id="bSound" aria-label="Som">♪</button>
  <button id="bFull" aria-label="Tela cheia">⤢</button>
</div>
<div id="rotate" hidden>
  <div class="phone" aria-hidden="true"></div>
  <h2>Gire o celular</h2>
  <p>O Werner luta melhor na horizontal. Vire o aparelho para jogar em tela larga.</p>
  <button id="rotOk">Jogar assim mesmo</button>
</div>

function drawWerner(f,face=1,o={}){

  const s=SPR_SCALE[f]*(o.s||1);
  ctx.save();ctx.scale(face,1);if(o.rot)ctx.rotate(o.rot);if(o.bob)ctx.scale(1,1+o.bob);if(o.filter)ctx.filter=o.filter;
  ctx.drawImage(im,-m.ax*s,-m.h*s,m.w*s,m.h*s);ctx.restore();
}

const W=640,H=360,GT=236,GB=342;
const INK='#15110e';
const FONT='"Bangers","Impact","Arial Black",sans-serif';
const cv=document.getElementById('game');
let ctx=cv.getContext('2d');
const MAINCTX=ctx;
let BASE=[1,0,0,1,0,0];
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
let rotateDismissed=false;
const rotateEl=document.getElementById('rotate');

function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const s=Math.min(vw/W,vh/H);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  cv.width=Math.max(1,Math.floor(W*s*dpr));cv.height=Math.max(1,Math.floor(H*s*dpr));
  BASE=[cv.width/W,0,0,cv.height/H,0,0];
  rotateEl.hidden=!(isTouch&&vh>vw*1.05&&!rotateDismissed);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.getElementById('rotOk').addEventListener('click',()=>{rotateDismissed=true;resize();});

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';}
function shade(c,t=0.25){return c.startsWith('#')?mix(c,'#000000',t):c;}

/* ---------- drawing primitives ---------- */
function rrPath(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
let OK=1,HL=false;
function rr(x,y,w,h,r,fill,lw=2){rrPath(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw*OK;ctx.strokeStyle=INK;ctx.stroke();}}
function ell(x,y,rx,ry,fill,lw=2){ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw*OK;ctx.strokeStyle=INK;ctx.stroke();}}
function limb(x1,y1,x2,y2,w,col){ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=INK;ctx.lineWidth=w+3*OK;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();if(HL){ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=w*.3;ctx.beginPath();ctx.moveTo(x1+1,y1);ctx.lineTo(x2+1,y2);ctx.stroke();}}
function poly(pts,fill,lw=2){ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(lw){ctx.lineWidth=lw*OK;ctx.strokeStyle=INK;ctx.stroke();}}
function txt(s,x,y,size,fill,align='center',stroke=INK,lw){ctx.font=size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=lw||Math.max(3,size/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y);}
function btxt(s,x,y,size,fill,align='center',weight=800){ctx.font=weight+' '+size+'px Nunito, "Trebuchet MS", sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=fill;ctx.fillText(s,x,y);}
function wrap(s,maxW,size,weight=800,font){ctx.font=font||(weight+' '+size+'px Nunito, "Trebuchet MS", sans-serif');const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function heart(x,y,s,col='#ff3b5c'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-8,-2,-6,-9,0,-5);ctx.bezierCurveTo(6,-9,8,-2,0,4);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=1.5/s;ctx.strokeStyle=INK;ctx.stroke();ctx.restore();}
function star(x,y,r1,r2,n,fill,lw=2.5){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=INK;ctx.stroke();}

let AC=null,master,musicGain,sfxGain,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
    musicGain=AC.createGain();musicGain.gain.value=.2;musicGain.connect(master);sfxGain=AC.createGain();sfxGain.gain.value=.7;sfxGain.connect(master);}catch(e){AC=null;}
}
function tone(f,dur,type='square',vol=.3,slide=0,when=0,dest){if(!AC)return;const t=AC.currentTime+Math.max(0,when);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+.03);}
let noiseBuf=null;
function noise(dur,vol=.3,filt=1200,when=0){if(!AC)return;if(!noiseBuf){const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}
  const t=AC.currentTime+Math.max(0,when);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=filt;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t);s.stop(t+dur+.02);}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const SFX={

let song=null,step=0,nextNote=0;
function playSong(name){song=name?SONGS[name]:null;step=0;if(AC)nextNote=AC.currentTime+.08;}
function musicTick(){
  if(!AC||!song||muted)return;
  const spb=60/song.bpm/2;
  if(nextNote<AC.currentTime-.25)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.15){
    const w=nextNote-AC.currentTime;
    const b=song.bass[step%song.bass.length],l=song.lead[step%song.lead.length];
    if(b)tone(mtof(b),spb*.9,'triangle',.55,0,w,musicGain);
    if(l)tone(mtof(l),spb*.85,'square',.22,0,w,musicGain);
    if(step%2===1)noise(.03,.05,7000,w);
    if(step%8===0)tone(110,.12,'sine',.5,-60,w,musicGain);
    nextNote+=spb;step++;
  }
}

/* ---------- player ---------- */
const SPD=150,SPDY=95,GRAV=980;
function moveAxes(){let mx=jx,my=jy;if(held.left)mx=-1;if(held.right)mx=1;if(held.up)my=-1;if(held.down)my=1;return[mx,my];}

function updatePlayer(dt){
  const p=P;p.inv=Math.max(0,p.inv-dt);if(p.sayT>0)p.sayT-=dt;
  const[mx,my]=moveAxes();
  p.moving=false;
  switch(p.state){
    case'hurt':p.t-=dt;p.x+=p.vx*dt;p.vx*=.86;if(p.t<=0)p.state='idle';break;
    case'down':
      p.vz-=GRAV*dt;p.z+=p.vz*dt;p.x+=p.vx*dt;
      if(p.z<=0){p.z=0;p.vz=0;p.vx*=.8;p.t-=dt;
        if(p.t<=0){if(p.hp<=0)loseLife();else{p.state='idle';p.inv=1.2;}}}
      break;
    case'special':{
      const before=p.t;p.t-=dt;
      if(before>.42&&p.t<=.42){flash=1;shake=10;SFX.special();
        enemies.forEach(e=>{if(e.state!=='dead'&&e.x>camX-20&&e.x<camX+W+20)damageEnemy(e,e.d.boss?40:32,true,e.x>=p.x?1:-1);});
        projs.length=0;}
      if(p.t<=0){p.state='idle';p.inv=.4;}
      break;}
    case'punch':{
      const dur=p.combo===2?.32:.22,el=dur-p.t;p.t-=dt;
      if(el>.05&&el<.15)playerAttack(p.combo===2?60:44,p.combo===2?14:8,p.combo===2,18);
      if(p.t<=0){p.state='idle';p.lastEnd=gT;}
      break;}
    case'jump':
      p.vz-=GRAV*dt;p.z+=p.vz*dt;p.x+=p.vx*dt;p.y+=my*SPDY*.4*dt;
      if(just.a&&!p.kicked){p.kicked=true;p.kickT=.35;p.hitSet.clear();SFX.punch();}
      if(p.kicked&&p.kickT>0){p.kickT-=dt;playerAttack(42,14,true,20);}
      if(p.z<=0){p.z=0;p.state='idle';p.kicked=false;dust(p.x,p.y,3);}
      break;
    default:{
      p.state='idle';
      if(mx||my){p.x+=mx*SPD*dt;p.y+=my*SPDY*dt;p.moving=true;p.walk+=dt*11;if(mx)p.face=mx>0?1:-1;}
      if(just.c){if(p.meter>=1){p.meter=0;p.state='special';p.t=.8;p.inv=1;say(p,pick(st.bg==='club'?['ESSA É PRA RIR!','PIADA PRONTA: VOCÊ PRESO!']:st.bg==='rugby'?['TACKLE DA JUSTIÇA!','TRY PELO MEIO AMBIENTE!']:WERNER_LINES),1.4);}else{pop(p.x,p.y,110,'LEI SEM CARGA',"#fff6e0",false,.8);}}
      else if(just.a){p.combo=(gT-p.lastEnd<.38&&p.lastHit)?(p.combo+1)%3:0;p.state='punch';p.t=p.combo===2?.32:.22;p.hitSet.clear();p.lastHit=false;SFX.punch();}
      else if(just.b){p.state='jump';p.vz=360;p.vx=mx*SPD*1.05;p.kicked=false;SFX.jump();}
    }
  }
  p.y=clamp(p.y,GT+14,GB-4);
  p.x=clamp(p.x,camX+18,Math.min(camX+W-18,st.len-18));
}
function playerAttack(reach,dmg,knock,depth){
  for(const e of enemies){
    if(e.state==='down'||e.state==='dead'||P.hitSet.has(e))continue;
    const s=e.d.look.scale||1,dx=(e.x-P.x)*P.face;
    if(dx>-10&&dx<reach+10*s&&Math.abs(e.y-P.y)<depth*(s>1?1.5:1)&&Math.abs(e.z-P.z)<50){P.hitSet.add(e);P.lastHit=true;damageEnemy(e,dmg,knock,P.face);P.meter=Math.min(1,P.meter+.07);}
  }
}
function hurtPlayer(dmg,knock,fromX){
  const p=P;if(p.inv>0||p.state==='down'||p.state==='special'||scene!=='play')return;
  p.hp-=dmg;SFX.hurt();shake=Math.max(shake,5);burst(p.x,p.y,p.z+60);
  const dir=p.x>=fromX?1:-1;
  if(p.hp<=0||knock){p.state='down';p.vz=230;p.vx=dir*130;p.t=p.hp<=0?1.1:.7;p.z=Math.max(p.z,1);p.inv=0;}
  else{p.state='hurt';p.t=.3;p.vx=dir*90;p.inv=.5;}
  if(p.hp<=0)p.hp=0;
}
function loseLife(){
  P.lives--;
  if(P.lives<0){scene='gameover';sceneT=0;continueT=9;playSong(null);return;}
  respawn();
}
function respawn(){Object.assign(P,{hp:100,state:'idle',inv:2.2,z:0,vz:0,meter:1});enemies.forEach(e=>{if(e.state!=='dead'){e.state='hurt';e.t=.5;e.vx=(e.x>=P.x?1:-1)*220;}});flash=.6;say(P,'AINDA NÃO ACABOU!',1.5);}

function makeEnemy(type,x,y){const d=DEF[type];return{type,d,x,y,z:0,vz:0,vx:0,face:-1,hp:d.hp,maxhp:d.hp,state:'walk',t:0,cd:rand(.8,1.6),walk:Math.random()*6,say:null,sayT:0,flash:0,charging:false,summoned:0,landed:true};}
function damageEnemy(e,dmg,knock,dir){
  if(e.state==='dead')return;
  e.hp-=dmg;e.flash=.12;score+=10;SFX.hit();shake=Math.max(shake,3);
  burst(e.x+dir*6,e.y,e.z+55*(e.d.look.scale||1),st&&st.bg);
  const armor=e.d.boss&&e.hp>0&&!knock;
  if(armor){e.state==='charge'||(e.state='hurt',e.t=.12,e.vx=dir*30);return;}
  if(e.hp<=0||knock){
    if(e.d.boss&&e.hp>0&&Math.random()<.5){e.state='hurt';e.t=.25;e.vx=dir*90;return;}
    e.state='down';e.vz=e.hp<=0?300:250;e.vx=dir*(e.d.boss?110:170);e.t=e.hp<=0?.7:.6;e.landed=false;e.charging=false;e.z=Math.max(e.z,1);
    if(e.hp<=0)defeat(e);
  }else{e.state='hurt';e.t=.28;e.vx=dir*70;}
}
function defeat(e){
  if(st.bg==='club')pop(camX+rand(80,W-80),GT-20,rand(30,60),pick(['HAHAHA!','KKKKK!','CLAP CLAP!']),'#fff6e0',false,1);
  score+=e.d.score;pop(e.x,e.y,(e.d.look.scale||1)*95,pick(e.d.defeat),'#ffd23f',true,1.6);
  if(e.d.boss){boss=null;shake=12;flash=.5;}
  const r=Math.random();
  if(e.d.boss)items.push({x:e.x,y:e.y,z:30,vz:150,k:e.d.final?'none':'bolo',t:0});
  else if(r<.18)items.push({x:e.x,y:e.y,z:20,vz:140,k:pick(['pao','coxinha']),t:0});
  else if(r<.24)items.push({x:e.x,y:e.y,z:20,vz:140,k:'livro',t:0});
}
function enemyStrike(e){
  const s=e.d.look.scale||1,dx=(P.x-e.x)*e.face;
  if(dx>-6&&dx<e.d.range+14&&Math.abs(P.y-e.y)<16*(s>1?1.4:1)&&P.z<34)hurtPlayer(e.d.dmg,e.d.knock&&Math.random()<.5,e.x);
}
function throwBarrel(e){SFX.throwB();const dx=P.x-e.x;const tt=clamp(Math.abs(dx)/260,.5,1.1);projs.push({x:e.x+e.face*14,y:e.y,z:62,vx:dx/tt,vz:260,t:0,owner:e});}

function updateEnemy(e,dt,idx){
  e.flash=Math.max(0,e.flash-dt);if(e.sayT>0)e.sayT-=dt;
  const s=e.d.look.scale||1;
  switch(e.state){
    case'hurt':e.t-=dt;e.x+=e.vx*dt;e.vx*=.86;if(e.t<=0)e.state='walk';break;
    case'down':
      e.vz-=GRAV*dt;e.z+=e.vz*dt;e.x+=e.vx*dt;
      if(e.z<=0){e.z=0;e.vz=0;e.vx*=.78;if(!e.landed){e.landed=true;dust(e.x,e.y,5);shake=Math.max(shake,s>1?6:2);}
        e.t-=dt;if(e.t<=0){if(e.hp<=0){e.state='dead';e.t=.7;}else{e.state='rise';e.t=.35;}}}
      break;
    case'rise':e.t-=dt;if(e.t<=0){e.state='walk';e.cd=.5;}break;
    case'dead':e.t-=dt;if(e.t<=0)e.remove=true;break;
    case'windup':
      e.t-=dt;if(e.d.weapon==='saw'||e.d.weapon==='bigsaw'){if(Math.random()<.2)SFX.saw();}
      if(e.t<=0){
        if(e.charging){e.charging=false;e.state='charge';e.vx=e.face*440;e.t=.85;e.hitDone=false;}
        else if(e.d.thrower){throwBarrel(e);e.state='cool';e.t=.45;e.cd=rand(1.6,2.6);}
        else{e.state='attack';e.t=.16;enemyStrike(e);}
      }
      break;
    case'attack':e.t-=dt;if(e.t<=0){e.state='cool';e.t=.35;e.cd=e.d.boss?rand(.7,1.3):rand(.9,1.8);}break;
    case'cool':e.t-=dt;if(e.t<=0)e.state='walk';break;
    case'charge':
      e.x+=e.vx*dt;e.t-=dt;if(Math.random()<.3)dust(e.x-e.face*20,e.y,1);
      if(!e.hitDone&&Math.abs(P.x-e.x)<34*s&&Math.abs(P.y-e.y)<22&&P.z<40){e.hitDone=true;hurtPlayer(e.d.dmg+4,true,e.x-e.face*30);}
      if(e.t<=0||e.x<camX-30||e.x>camX+W+30){e.x=clamp(e.x,camX+20,camX+W-20);e.state='cool';e.t=.7;e.cd=1.4;}
      break;
    case'walk':default:ai(e,dt,idx);
  }
  e.y=clamp(e.y,GT+14,GB-4);
  if(e.state==='walk'&&e.entered)e.x=clamp(e.x,camX-10,camX+W+10);
  if(!e.entered&&e.x>camX+16&&e.x<camX+W-16)e.entered=true;
  // boss summons
  if(e.d.boss&&e.hp>0){const fr=e.hp/e.maxhp;if((fr<.66&&e.summoned<1)||(fr<.33&&e.summoned<2)){e.summoned++;say(e,'CAPANGAS!',1.4);
    const minions=e.type==='baron'?['agente','agente']:e.type==='bossMachao'?['machao','chato']:e.type==='bossSerra'?['logger','machao']:['thug','machao'];
    minions.forEach((m,k)=>spawnQ.push(m));}}
}
function ai(e,dt,idx){
  e.cd-=dt;
  const p=P;const dx=p.x-e.x,dy=p.y-e.y;
  e.face=dx>=0?1:-1;
  if(p.state==='down'||scene!=='play'){e.walk+=dt*4;e.moving=false;if(e.d.sprite&&!(e.sayT>0)&&Math.random()<.01)say(e,pick(['Chefe, peguei ele!','Alvo neutralizado.','Missão cumprida, Barão!']),1.6);return;}
  // limit attackers: rank by distance
  let rank=0;for(const o of enemies)if(o!==e&&o.state!=='dead'&&!o.d.thrower&&Math.abs(o.x-p.x)<Math.abs(dx))rank++;
  let tx,ty=p.y;
  if(e.d.thrower){
    tx=p.x-Math.sign(dx||1)*200;
    if(Math.abs(dy)<18&&Math.abs(dx)>90&&Math.abs(dx)<320&&e.cd<=0&&e.entered){e.state='windup';e.t=e.d.windup;return;}
  }else{
    const want=rank>=2&&!e.d.boss?130:e.d.range*.75*(e.d.look.scale||1)*.85;
    tx=p.x-Math.sign(dx||1)*want;
    if(rank>=2&&!e.d.boss)ty=p.y+(idx%2?30:-30);
    if(e.d.boss&&e.cd<=0&&Math.abs(dy)<24&&Math.abs(dx)>150&&e.entered&&Math.random()<.04){e.state='windup';e.charging=true;e.t=.7;say(e,'GRRRR!',.8);return;}
    if(rank<2&&Math.abs(dx)<=e.d.range*(e.d.look.scale||1)*.95&&Math.abs(dy)<12&&e.cd<=0){e.state='windup';e.t=e.d.windup;return;}
  }
  let mx=tx-e.x,my=ty-e.y;const L=Math.hypot(mx,my);
  if(L>5){e.x+=mx/L*e.d.spd*dt;e.y+=my/L*e.d.spd*.7*dt;e.walk+=dt*10;e.moving=true;}else e.moving=false;
  for(const o of enemies){if(o===e||o.state==='dead')continue;if(Math.abs(o.x-e.x)<26&&Math.abs(o.y-e.y)<10){e.y+=(e.y>=o.y?1:-1)*40*dt;}}
}

/* ---------- waves ---------- */
function startWave(w){
  waveActive=w;lockX=w.at;camX=Math.min(camX,w.at);spawnQ=w.list.slice();spawnT=.2;
  if(w.boss){const d=DEF[w.list[0]];pop(camX+W/2,300,140,'CHEFÃO: '+d.name,'#ff4f3a',true,2.2);}
}
function spawnOne(type){
  const fromLeft=!DEF[type].boss&&Math.random()<.3&&camX>50;
  const x=fromLeft?camX-40:camX+W+40+(DEF[type].boss?30:0);
  const e=makeEnemy(type,x,rand(GT+24,GB-14));e.face=fromLeft?1:-1;
  enemies.push(e);
  if(Math.random()<.65||e.d.boss)say(e,pick(e.d.intro),2);
  if(e.d.boss)boss=e;
  if(type==='machao'){const wm=women.find(o=>o.state==='scared');if(wm)say(wm,'Socorro!',1.6);}
}
function clearWave(){
  const idx=waveIdx;
  women.forEach(o=>{if(o.w===idx&&o.state==='scared'){o.state='thank';o.t=2.4;say(o,'Obrigada, Dr. Werner!',2.4);peopleSaved++;score+=300;hearts(o.x,o.y,80,4);SFX.save();}});
  trees.forEach(o=>{if(o.w===idx&&o.state==='threat'){o.state='saved';treesSaved++;score+=250;pop(o.x,o.y,130,'ÁRVORE SALVA!','#62d36a');leaves(o.x,o.y,10);}});
  if(cage&&cage.w===idx){cage.open=true;dogs.forEach(d=>{if(d.w===idx&&d.state==='caged')freeDog(d);});}
  waveIdx++;waveActive=null;lockX=Infinity;
  if(st.final&&idx===st.waves.length-1){startVictory();return;}
  goT=4;SFX.clear();
}
function freeDog(d){
  d.state='follow';dogsSaved++;score+=200;SFX.bark();hearts(d.x,d.y,20,4);pop(d.x,d.y,40,'LIVRE!','#fff6e0');
  const fol=dogs.filter(o=>o.state==='follow');
  fol.forEach((o,k)=>o.slot=k);
  if(fol.length>4){const old=fol[0];old.state='leave';pop(old.x,old.y,40,'RUMO AO ABRIGO!','#ffd23f',false,1.2);}
}
function updateDogs(dt){
  for(const d of dogs){
    d.t+=dt;
    if(d.state==='chained'){if(Math.abs(P.x-d.x)<30&&Math.abs(P.y-d.y)<18&&P.z<20)freeDog(d);}
    else if(d.state==='follow'){
      d.bite-=dt;
      const tx=P.x-P.face*(34+d.slot*20),ty=clamp(P.y+(d.slot%2?14:-14),GT+14,GB-4);
      const dx=tx-d.x,dy=ty-d.y,L=Math.hypot(dx,dy);
      d.run=L>8;if(L>8){const sp=L>120?320:200;d.x+=dx/L*sp*dt;d.y+=dy/L*sp*.8*dt;d.face=dx>=0?1:-1;}
      if(d.bite<=0){const e=enemies.find(e=>e.state!=='dead'&&e.state!=='down'&&Math.abs(e.x-d.x)<110&&Math.abs(e.y-d.y)<28);if(e){d.state='attack';d.target=e;d.tt=1.2;}}
    }else if(d.state==='attack'){
      const e=d.target;d.tt-=dt;
      if(!e||e.state==='dead'||e.remove||d.tt<=0){d.state='follow';d.bite=1;continue;}
      const dx=e.x-d.x,dy=e.y-d.y,L=Math.hypot(dx,dy);d.face=dx>=0?1:-1;d.run=true;
      if(L>16){d.x+=dx/L*330*dt;d.y+=dy/L*260*dt;}
      else{damageEnemy(e,4,false,d.face);pop(e.x,e.y,70,'AU! AU!','#fff6e0',false,.8);SFX.bark();d.bite=rand(2,3);d.state='follow';}
    }else if(d.state==='leave'){d.run=true;d.face=1;d.x+=280*dt;if(d.x>camX+W+60)d.remove=true;}
  }
  dogs=dogs.filter(d=>!d.remove);
}
function updateWomen(dt){
  for(const o of women){if(o.sayT>0)o.sayT-=dt;o.t-=dt;
    if(o.state==='scared'){o.face=P.x<o.x?-1:1;if(Math.random()<.004&&!o.sayT)say(o,pick(['Socorro!','Me deixa em paz!','Alguém ajuda!']),1.4);}
    else if(o.state==='thank'){o.face=P.x<o.x?-1:1;if(o.t<=0){o.state='leave';items.push({x:o.x,y:o.y,z:30,vz:120,k:'pao',t:0});}}
    else if(o.state==='leave'){o.face=-1;o.x-=110*dt;o.walk=(o.walk||0)+dt*10;if(o.x<camX-60)o.remove=true;}}
  women=women.filter(o=>!o.remove);
}
function updateItems(dt){
  for(const it of items){it.t+=dt;if(it.z>0||it.vz>0){it.vz-=GRAV*dt;it.z+=it.vz*dt;if(it.z<=0){it.z=0;it.vz=0;}}
    if(it.k==='none'){it.remove=true;continue;}
    if(it.z<6&&Math.abs(P.x-it.x)<22&&Math.abs(P.y-it.y)<16&&P.state!=='down'){const I=ITEMS[it.k];
      if(I.hp)P.hp=Math.min(100,P.hp+I.hp);if(I.meter)P.meter=1;score+=50;SFX.pick();pop(it.x,it.y,50,I.label,'#62d36a',false,1.1);it.remove=true;}}
  items=items.filter(i=>!i.remove);
}
function updateProjs(dt){
  for(const b of projs){b.t+=dt;b.x+=b.vx*dt;b.vz-=GRAV*.9*dt;b.z+=b.vz*dt;
    if(Math.abs(P.x-b.x)<18&&Math.abs(P.y-b.y)<14&&Math.abs(P.z+40-b.z)<44&&P.state!=='down'){hurtPlayer(b.owner.d.dmg,false,b.x-b.vx);b.remove=true;splash(b);}
    else if(b.z<=0){b.remove=true;splash(b);}}
  projs=projs.filter(b=>!b.remove);
}
function splash(b){SFX.splash();const c=b.owner.d.weapon==='tomato'?'#e8322a':'#9be22c';for(let i=0;i<8;i++)parts.push({k:'drop',c,x:b.x,y:b.y,z:4,vx:rand(-70,70),vz:rand(60,170),life:.6,max:.6});}
function updateParts(dt){
  for(const q of parts){q.life-=dt;if(q.vx){q.x+=q.vx*dt;}if(q.vz!==undefined){q.vz-=(q.k==='heart'||q.k==='leaf'?60:500)*dt;q.z=Math.max(0,q.z+q.vz*dt);}}
  parts=parts.filter(q=>q.life>0);
  for(const q of pops)q.life-=dt;pops=pops.filter(q=>q.life>0);
}

function startVictory(){scene='victory';victoryT=0;playSong(null);SFX.clear();P.state='idle';P.inv=9;projs.length=0;}

function updatePlay(dt){
  sceneT+=dt;if(bannerT>0)bannerT-=dt;if(hintT>0)hintT-=dt;if(goT>0)goT-=dt;
  updatePlayer(dt);
  if(!waveActive&&waveIdx<st.waves.length&&camX>=st.waves[waveIdx].at-1)startWave(st.waves[waveIdx]);
  if(waveActive){
    spawnT-=dt;
    const alive=enemies.filter(e=>e.state!=='dead').length;
    if(spawnQ.length&&spawnT<=0&&alive<(waveActive.boss?4:3)){spawnOne(spawnQ.shift());spawnT=.8;}
    if(!spawnQ.length&&enemies.length===0)clearWave();
  }
  const target=P.x-W*.42;const maxCam=Math.min(lockX,st.len-W);
  camX=Math.max(camX,Math.min(target,maxCam));
  enemies.forEach((e,i)=>updateEnemy(e,dt,i));enemies=enemies.filter(e=>!e.remove);
  trees.forEach(tr=>{tr.shake=enemies.some(e=>e.type==='logger'&&Math.abs(e.x-tr.x)<60&&e.state!=='dead')?1:0;});
  updateDogs(dt);updateWomen(dt);updateItems(dt);updateProjs(dt);updateParts(dt);
  if(scene==='play'&&!st.final&&waveIdx>=st.waves.length&&!waveActive&&P.x>st.len-70){
    scene='clear';sceneT=0;SFX.clear();playSong(null);
    dogs.forEach(d=>{if(d.state==='follow'||d.state==='attack')d.state='leave';});
  }
}

const PXK=1.7;const pxCv=document.createElement('canvas');
function pixelDraw(scale,fn,filter){
  const cw=Math.ceil(240*scale/PXK),ch=Math.ceil(170*scale/PXK);
  if(pxCv.width<cw||pxCv.height<ch){pxCv.width=Math.max(pxCv.width,cw);pxCv.height=Math.max(pxCv.height,ch);}
  const g=pxCv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,pxCv.width,pxCv.height);
  g.setTransform(1/PXK,0,0,1/PXK,cw/2,ch-3);
  const keep=ctx;ctx=g;try{fn();}finally{ctx=keep;}
  ctx.save();ctx.imageSmoothingEnabled=false;if(filter)ctx.filter=filter;
  ctx.drawImage(pxCv,0,0,cw,ch,-cw/2*PXK,-(ch-3)*PXK,cw*PXK,ch*PXK);ctx.restore();
}
function drawEnemy(e){

  ctx.save();ctx.translate(e.x,e.y-e.z);
  if(e.d.sprite){
    const pre=e.d.sprite,o={filter:e.flash>0?'brightness(1.8)':null};let fr='stance',face=e.face;
    if(e.state==='down'||e.state==='dead'){if(e.z>0)fr='hurt2';else{fr='down';face=-e.face;}}
    else if(e.state==='rise')fr='hurt2';
    else if(e.state==='hurt')fr='hurt';
    else if(e.state==='windup')fr='attack';
    else if(e.state==='attack'){fr='attack';o.rot=.18;}
    else if(e.state==='charge')fr='walk2';
    else if(P.state==='down'||scene==='gameover')fr='victory';
    else if(e.moving&&e.state==='walk')fr='walk'+(1+Math.floor(e.walk/1.6)%3);
    drawWerner(pre+fr,face,o);ctx.restore();
    if(e.state==='windup')txt('!',e.x,e.y-112,20,'#ff4f3a');
    return;
  }
  const Q={face:e.face,t:gT,walk:e.walk,moving:e.state==='walk'&&e.moving,angry:true};
  if(e.state==='windup'){Q.windup=!e.d.thrower;if(e.d.thrower){Q.windup=true;}}
  if(e.state==='attack'||e.state==='charge'){Q.attack=true;Q.shout=true;}
  if(e.state==='hurt'){Q.hurt=true;Q.shout=true;}
  if(e.state==='down'||e.state==='dead'){Q.down=e.z>0?.6:1;Q.ko=e.hp<=0;}
  if(e.state==='rise')Q.down=.5;
  pixelDraw(e.d.look.scale||1,()=>drawHuman(e.d.look,Q),e.flash>0?'brightness(1.8)':null);
  ctx.restore();
  if(e.state==='windup'&&!e.d.thrower){txt('!',e.x,e.y-(e.d.look.scale||1)*112,20,'#ff4f3a');}
}

  if(bannerT>0){const a=Math.min(1,bannerT*2);ctx.globalAlpha=a;rr(W/2-180,118,360,82,12,'rgba(21,17,14,.85)',3);txt(st.name,W/2,140,22,'#5ec8f2');txt(st.title,W/2,174,36,'#ffd23f');ctx.globalAlpha=1;}
  if(hintT>0&&bannerT<=0){const a=Math.min(1,hintT);ctx.globalAlpha=a;rr(W/2-160,72,320,40,10,'rgba(21,17,14,.75)',0);
    btxt(isTouch?'Direcional à esquerda • SOCO • PULO + SOCO = voadora':'Setas: andar • J soco • K pulo • L especial',W/2,84,11,'#fff6e0');
    btxt('Encoste nos cães para soltá-los!',W/2,100,11,'#ffd23f');ctx.globalAlpha=1;}
  bC.classList.toggle('ready',P.meter>=1);
}

/* =========================================================
   SCENES
   ========================================================= */
let titleDogs=[0,1,2,3,4,5].map(i=>({c:i,x:-60-i*70}));
function drawTitle(){
  bgCity(gT*40);
  ctx.fillStyle='rgba(15,36,24,.35)';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,H*.5,0,H);g.addColorStop(0,'rgba(15,36,24,0)');g.addColorStop(1,'rgba(15,36,24,.85)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  titleDogs.forEach((d,i)=>{d.x+=1.6;if(d.x>W+40)d.x=-40;ctx.save();ctx.translate(d.x,GB-12-(i%2)*14);drawDog(d.c,{face:1,t:gT+i,run:true,happy:true});ctx.restore();});
  ctx.save();ctx.translate(150,330);const ph=Math.floor(gT*1.5)%4;drawWerner(['stance','punch','stance2','kick'][ph],1,{s:2.3});ctx.restore();
  ctx.save();ctx.translate(410,98);ctx.rotate(-.05);
  txt('WERNER',0,0,78,'#ffd23f','center',INK,10);
  txt('FÚRIA VERDE',6,58,44,'#62d36a','center',INK,8);
  ctx.restore();
  rr(318,182,190,28,14,'#ff4f3a',2.5);txt('EDIÇÃO ESPECIAL 60 ANOS',413,197,16,'#fff6e0','center',INK,3);
  if(Math.floor(gT*2.2)%2===0)txt(isTouch?'TOQUE PARA COMEÇAR':'APERTE ENTER PARA COMEÇAR',413,250,22,'#fff6e0');
  btxt('Salve os cães • Proteja as florestas • Defenda as pessoas',413,280,11,'#fff6e0');
}
const INTRO=[
  {cap:'São Paulo, 2026. Hoje é o aniversário de 60 anos do Dr. Werner Grau, advogado ambientalista, comediante de stand-up, jogador de rugby e protetor de centenas de cães.',art:'party'},
  {cap:'Mas o terrível BARÃO DA MOTOSSERRA roubou o bolo da festa, prendeu os cães da cidade e quer derrubar as árvores do campo de rugby!',art:'baron'},
  {cap:'Armado só com os punhos e a Lei de Crimes Ambientais, Werner parte para a briga. Hoje ninguém escapa de uma multa!',art:'fight'}
];
function drawIntro(){
  const pn=INTRO[introPanel];
  drawBG(introPanel===0?'club':introPanel===1?'rugby':'city',introPanel*500+gT*10);
  ctx.fillStyle='rgba(15,36,24,.25)';ctx.fillRect(0,0,W,H);
  rr(14,12,W-28,74,6,'#ffd23f',3);
  const lines=wrap(pn.cap,W-64,15,800);lines.forEach((l,i)=>btxt(l,W/2,32+i*19-(lines.length-2)*9,15,INK));
  if(pn.art==='party'){
    ctx.save();ctx.translate(250,330);drawWerner('victory',1,{s:1.7});partyHat(-2,-166,1.4);ctx.restore();
    [[380,'#ff4f3a'],[420,'#5ec8f2'],[460,'#ffd23f']].forEach(([x,c],i)=>{const y=150+Math.sin(gT*2+i)*6;ctx.strokeStyle=INK;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+22);ctx.lineTo(x-10,300);ctx.stroke();ell(x,y,16,20,c);});
    for(let i=0;i<5;i++){ctx.save();ctx.translate(340+i*50,330-(i%2)*14);drawDog(i,{face:-1,t:gT+i,hop:true,happy:true,hat:i%2===0});ctx.restore();}
  }else if(pn.art==='baron'){
    ctx.save();ctx.translate(330,330);ctx.scale(1.3,1.3);drawHuman(DEF.baron.look,{face:-1,t:gT,shout:true,angry:true,holdCake:true});ctx.restore();
    txt('MUAHAHA!',470,140+Math.sin(gT*8)*3,30,'#ff4f3a');
    for(let i=0;i<3;i++){ctx.save();ctx.translate(120+i*60,320);rr(-30,-34,6,34,2,'#7a4b28');drawDog(i+2,{face:-1,t:gT,sad:true});ctx.restore();}
  }else{
    ctx.save();ctx.translate(300,335);const ph=Math.floor(gT*2)%2;drawWerner(ph?'punch':'kick',1,{s:1.9});ctx.restore();
    star(470,190,60,34,12,'#ffd23f',3);txt('VAMOS!',470,192,34,'#ff4f3a');
    ctx.save();ctx.translate(200,334);drawDog(0,{face:1,t:gT,happy:true,hop:true});ctx.restore();
  }
  for(let i=0;i<INTRO.length;i++)ell(W/2-20+i*20,H-14,5,5,i===introPanel?'#ffd23f':'#fff6e0',1.5);
  if(sceneT>1&&Math.floor(gT*2)%2===0)txt('TOQUE ➜',W-60,H-16,16,'#fff6e0');
}
let confetti=[];
function startEnding(){scene='ending';sceneT=0;confetti=[];for(let i=0;i<120;i++)confetti.push({x:rand(0,W),y:rand(-H,0),vy:rand(30,80),vx:rand(-15,15),r:rand(0,6),c:pick(['#ff4f3a','#ffd23f','#5ec8f2','#62d36a','#ff7ab8','#fff6e0'])});playParabens();}
function drawEnding(dt){
  sky('#ff9a5c','#ffe3a8',H);
  ell(W/2,GT-10,60,60,'#fff1b8',0);
  ctx.fillStyle='#7cc45c';ctx.fillRect(0,GT-20,W,H);ctx.fillStyle='#6ab34c';ctx.fillRect(0,GT+40,W,H);
  rr(W/2-88,GT-122,176,46,6,'#a86b3c',3);rr(W/2-81,GT-115,162,32,4,'#c48b5f',1.5);txt('ABRIGO DO WERNER',W/2,GT-99,16,'#fff6e0');
  rr(W/2-80,GT-76,7,56,2,'#7a4b28');rr(W/2+73,GT-76,7,56,2,'#7a4b28');
  ctx.strokeStyle='#7a4b28';ctx.lineWidth=4;for(let y of[GT-40,GT-28]){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=0;i<34;i++){const row=i%3,x=(i*53+row*25)%(W+40)-20,y=GT+6+row*34+(i%5)*3;if(Math.abs(x-W/2)<70&&row<2)continue;ctx.save();ctx.translate(x,y);drawDog(i,{face:x<W/2?1:-1,t:gT+i*.3,hop:true,happy:true,hat:i%4===0});ctx.restore();}
  ctx.save();ctx.translate(W/2-34,GT+92);drawWerner('victory',1,{s:1.3});partyHat(-2,-128,1.1);ctx.restore();
  drawCake(W/2+52,GT+72,.95,true);
  for(const c of confetti){c.y+=c.vy*dt;c.x+=c.vx*dt+Math.sin(gT*3+c.r)*.3;c.r+=dt*4;if(c.y>H+10){c.y=-10;c.x=rand(0,W);}ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-3,-2,6,4);ctx.restore();}
  ctx.save();ctx.translate(W/2,40);const s=1+Math.sin(gT*3)*.03;ctx.scale(s,s);txt('FELIZ 60 ANOS, WERNER!',0,0,40,'#ffd23f','center',INK,8);ctx.restore();
  rr(16,66,196,104,10,'rgba(21,17,14,.82)',2);
  const rows=[['Cães resgatados',dogsSaved],['Árvores salvas',treesSaved],['Pessoas protegidas',peopleSaved],['Pontos',score]];
  rows.forEach(([k,v],i)=>{btxt(k,28,84+i*21,12,'#fff6e0','left');txt(String(v),200,84+i*21,15,'#ffd23f','right',INK,3);});
  rr(W-226,66,210,104,10,'rgba(255,246,224,.94)',2);
  const lines=wrap(DEDICATORIA,186,11,800);lines.slice(0,6).forEach((l,i)=>btxt(l,W-121,80+i*14,11,INK));
  btxt(ASSINATURA,W-28,80+Math.min(6,lines.length)*14+2,11,'#d23b3b','right',900);
  rr(W/2-120,GB-26,240,22,11,'rgba(21,17,14,.75)',0);btxt('O abrigo agora tem '+(ABRIGO_BASE+dogsSaved)+' cães felizes!',W/2,GB-15,12,'#fff6e0');
  if(sceneT>5&&Math.floor(gT*2)%2===0)txt('TOQUE PARA JOGAR DE NOVO',W/2,GB-44,16,'#fff6e0');
}
function drawOverlay(title,sub,sub2){ctx.fillStyle='rgba(15,36,24,.72)';ctx.fillRect(0,0,W,H);txt(title,W/2,H/2-40,48,'#ffd23f','center',INK,8);if(sub)btxt(sub,W/2,H/2+10,15,'#fff6e0');if(sub2)txt(sub2,W/2,H/2+46,20,'#62d36a');}

function togglePause(force){if(scene!=='play'&&scene!=='paused')return;if(force===true){if(scene==='play')scene='paused';return;}scene=scene==='paused'?'play':'paused';}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  try{tick(dt);}catch(err){console.error(err);}
  for(const k in just)just[k]=false;tapped=false;
  requestAnimationFrame(frame);
}
let lastScene='';
const topEl=document.getElementById('top');
function tick(dt){
  gT+=dt;musicTick();
  if(scene!==lastScene){lastScene=scene;ctlEl.hidden=!(isTouch&&scene==='play');document.getElementById('bPause').hidden=!(scene==='play'||scene==='paused');document.getElementById('bFull').hidden=!!document.fullscreenElement;topEl.hidden=scene==='ending'||scene==='intro';}
  shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*2.5);
  ctx.setTransform(...BASE);
  switch(scene){
    case'title':drawTitle();if(tapped&&gT>.3)startGame();break;
    case'intro':sceneT+=dt;drawIntro();if((tapped&&sceneT>.6)||sceneT>9){introPanel++;sceneT=0;if(introPanel>=INTRO.length)loadStage(0);}break;
    case'play':updatePlay(dt);renderPlay();break;
    case'paused':renderPlay();drawOverlay('PAUSA','Toque no II para voltar à luta');break;
    case'clear':{sceneT+=dt;updateParts(dt);updateDogs(dt);renderPlay();
      drawOverlay('FASE CONCLUÍDA!','Cães: '+dogsSaved+'   •   Árvores: '+treesSaved+'   •   Pessoas: '+peopleSaved+'   •   Pontos: '+score,sceneT>1.2?'TOQUE PARA CONTINUAR':'');
      if(tapped&&sceneT>1.2){P.hp=Math.min(100,P.hp+40);loadStage(stageIdx+1);}break;}
    case'victory':{victoryT+=dt;clean=Math.min(1,clean+dt*.5);updateParts(dt);updateDogs(dt);
      P.x=lerp(P.x,st.len-140,dt*2);P.y=lerp(P.y,GT+60,dt*2);P.face=1;P.moving=false;
      renderPlay();if(victoryT>1.2){txt('O BOLO FOI RECUPERADO!',W/2,110,34,'#ffd23f','center',INK,7);btxt('E as árvores do campo estão salvas!',W/2,145,14,'#fff6e0');}
      if(victoryT>4.2||(tapped&&victoryT>2))startEnding();break;}
    case'gameover':{sceneT+=dt;continueT-=dt;renderPlay();
      drawOverlay('NOCAUTE!','Entrar com recurso? Toque para continuar a luta.',String(Math.max(0,Math.ceil(continueT))));
      if(tapped&&sceneT>.8){P.lives=2;P.hp=100;P.state='idle';P.inv=2.5;P.meter=1;scene='play';playSong(st.music);respawn();}
      else if(continueT<=0){scene='title';playSong(null);}break;}
    case'ending':sceneT+=dt;drawEnding(dt);if(tapped&&sceneT>5){scene='title';gT=0;}break;
  }
}
function renderPlay(){
  ctx.save();
  if(shake>0)ctx.translate(rand(-shake,shake)*.5,rand(-shake,shake)*.5);
  drawBG(st.bg,camX);
  ctx.save();ctx.translate(-Math.round(camX),0);drawWorld();ctx.restore();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,250,220,'+flash*.8+')';ctx.fillRect(0,0,W,H);}
  drawHUD();
}

resize();
if(document.fonts&&document.fonts.load){document.fonts.load('20px Bangers').catch(()=>{});}
window.__G={get scene(){return scene;},set scene(v){scene=v;},startGame,loadStage,startEnding,startVictory,get P(){return P;},get enemies(){return enemies;},STAGES,
  skipTo(i){if(!P)P=newPlayer();loadStage(i);},jump(x){camX=x-200;P.x=x;waveIdx=st.waves.length-1;},killAll(){enemies.forEach(e=>damageEnemy(e,999,true,1));}};
requestAnimationFrame(frame);
</script>
